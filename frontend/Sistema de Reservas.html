<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProyectoChiriquistorage — Sistema de Reserva de Stands</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="public-screens.jsx"></script>
<script type="text/babel" src="admin-screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfy"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const density = tweaks.density;

  // Wrapper for desktop screens (browser-frame-ish)
  const DesktopFrame = ({ children, w = 1280, h = 800 }) => (
    <div style={{ width: w, height: h, background: '#fff', borderRadius: 8, overflow: 'hidden', position: 'relative', border: '1px solid #d4d2cd' }}>
      <div style={{ height: 32, background: '#F4F4F2', borderBottom: '1px solid #E7E5E1', display: 'flex', alignItems: 'center', padding: '0 12px', gap: 6 }}>
        <span style={{ width: 11, height: 11, borderRadius: 6, background: '#FF5F57' }} />
        <span style={{ width: 11, height: 11, borderRadius: 6, background: '#FEBC2E' }} />
        <span style={{ width: 11, height: 11, borderRadius: 6, background: '#28C840' }} />
        <div style={{ flex: 1, textAlign: 'center', fontSize: 11, color: '#6B6862', fontFamily: 'Inter, system-ui' }}>standly.app/expo-junio-2026</div>
      </div>
      <div style={{ height: h - 32 }}>{children}</div>
    </div>
  );

  const Phone = ({ children }) => (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%', padding: 20, background: '#f0eee9' }}>
      <IOSDevice width={360} height={780}>{children}</IOSDevice>
    </div>
  );

  return (
    <>
      <DesignCanvas>
        <DCSection id="overview" title="ProyectoChiriquistorage" subtitle="Sistema de reservas de stands · 9 pantallas · público + administrador">
          <DCArtboard id="cover" label="Sistema visual" width={760} height={500}>
            <CoverArtboard />
          </DCArtboard>
          <DCArtboard id="components" label="Componentes" width={760} height={500}>
            <ComponentsArtboard />
          </DCArtboard>
        </DCSection>

        <DCSection id="public-map" title="1 · Pantalla principal — Mapa interactivo" subtitle="Mobile y desktop lado a lado">
          <DCArtboard id="mobile" label="Mobile · 360×780" width={420} height={840}>
            <Phone><PublicMapMobile density={density} /></Phone>
          </DCArtboard>
          <DCArtboard id="desktop" label="Desktop · 1280×800" width={1280} height={800}>
            <DesktopFrame><PublicMapDesktop density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="public-detail" title="2 · Detalle del stand" subtitle="Bottom sheet en mobile, panel lateral en desktop (ver pantalla 1)">
          <DCArtboard id="sheet" label="Bottom sheet — mobile" width={420} height={840}>
            <Phone><PublicStandDetailMobile /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="public-form" title="3 · Formulario de reserva" subtitle="Variación A: mobile vertical · Variación B: desktop con resumen del stand">
          <DCArtboard id="form-mobile" label="A · Mobile" width={420} height={840}>
            <Phone><PublicFormMobile density={density} /></Phone>
          </DCArtboard>
          <DCArtboard id="form-desktop" label="B · Desktop" width={1280} height={800}>
            <DesktopFrame><PublicFormDesktop /></DesktopFrame>
          </DCArtboard>
          <DCArtboard id="confirm" label="Confirmación → WhatsApp" width={420} height={840}>
            <Phone><PublicConfirmationMobile /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-login" title="4 · Login del administrador">
          <DCArtboard id="login" label="Login" width={1280} height={800}>
            <DesktopFrame><AdminLogin /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-dashboard" title="5 · Dashboard / Panel principal" subtitle="Resumen + solicitudes pendientes con acciones rápidas">
          <DCArtboard id="dashboard" label="Dashboard" width={1280} height={800}>
            <DesktopFrame><AdminDashboard density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-map" title="6 · Mapa administrativo" subtitle="Mismo mapa con acciones: Confirmar / Reservar manualmente / Liberar">
          <DCArtboard id="adminmap" label="Mapa admin" width={1280} height={800}>
            <DesktopFrame><AdminMap density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-tiers" title="7 · Gestión de categorías de precio">
          <DCArtboard id="tiers" label="Tiers" width={1280} height={800}>
            <DesktopFrame><AdminTiers density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-cycles" title="8 · Gestión de ciclos mensuales">
          <DCArtboard id="cycles" label="Ciclos" width={1280} height={800}>
            <DesktopFrame><AdminCycles density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin-export" title="9 · Exportación de PDF" subtitle="Filtros + agrupación + vista previa del reporte">
          <DCArtboard id="export" label="Exportar" width={1280} height={800}>
            <DesktopFrame><AdminExport density={density} /></DesktopFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Densidad">
          <TweakRadio
            label="Espaciado del UI"
            value={tweaks.density}
            onChange={(v) => setTweak('density', v)}
            options={[
              { value: 'comfy', label: 'Cómoda' },
              { value: 'compact', label: 'Compacta' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// ─── Cover & components artboards ───
function CoverArtboard() {
  return (
    <div className="cs-screen" style={{ width: '100%', height: '100%', padding: 36, display: 'flex', flexDirection: 'column', gap: 20, background: '#fff' }}>
      <CSLogo size={18} />
      <div>
        <div style={{ fontSize: 32, fontWeight: 700, letterSpacing: -0.8 }}>Sistema de reserva de stands</div>
        <div style={{ fontSize: 14, color: T.textMuted, marginTop: 6, lineHeight: 1.5, maxWidth: 540 }}>
          UX/UI completo para Expo Emprende — 9 pantallas (pública + administrador). Mobile-first, responsivo, en español, pensado para usuarios sin experiencia tecnológica.
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginTop: 4 }}>
        {[
          { l: 'Acento', v: '#2563EB', sub: 'Azul confianza' },
          { l: 'Estados', v: '3', sub: 'Disponible · Por confirmar · Reservado' },
          { l: 'Tiers', v: '3', sub: 'A · B · C ($110–$250)' },
        ].map(s => (
          <div key={s.l} style={{ padding: 14, border: `1px solid ${T.border}`, borderRadius: 10 }}>
            <div style={{ fontSize: 11, color: T.textMuted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.4 }}>{s.l}</div>
            <div style={{ fontSize: 22, fontWeight: 700, marginTop: 4 }}>{s.v}</div>
            <div style={{ fontSize: 11, color: T.textSubtle }}>{s.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: 0.6 }}>Paleta</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {[T.text, T.textMuted, T.surface2, T.accent, T.available, T.pending, T.reserved, T.tierA, T.tierB, T.tierC].map(c => (
            <div key={c} style={{ flex: 1, height: 36, borderRadius: 6, background: c, border: `1px solid ${T.border}` }} />
          ))}
        </div>
        <div style={{ fontSize: 11, color: T.textSubtle }}>Tipografía: Inter (UI) + JetBrains Mono (códigos / cédulas)</div>
      </div>
    </div>
  );
}

function ComponentsArtboard() {
  return (
    <div className="cs-screen" style={{ width: '100%', height: '100%', padding: 28, display: 'flex', flexDirection: 'column', gap: 18, background: T.surface }}>
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: 0.6 }}>Componentes</div>
        <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.5, marginTop: 2 }}>Sistema reutilizable</div>
      </div>
      <CSCard padding={16}>
        <div style={{ fontSize: 12, fontWeight: 600, color: T.textMuted, marginBottom: 10 }}>Botones</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <CSButton variant="primary">Primario</CSButton>
          <CSButton variant="secondary">Secundario</CSButton>
          <CSButton variant="ghost">Fantasma</CSButton>
          <CSButton variant="success" icon={Icons.check(13)}>Confirmar</CSButton>
          <CSButton variant="danger" icon={Icons.x(13)}>Rechazar</CSButton>
          <CSButton variant="whatsapp" icon={Icons.whatsapp(15)}>WhatsApp</CSButton>
        </div>
      </CSCard>
      <CSCard padding={16}>
        <div style={{ fontSize: 12, fontWeight: 600, color: T.textMuted, marginBottom: 10 }}>Badges de estado</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <CSBadge status="available" dot>Disponible</CSBadge>
          <CSBadge status="pending" dot>Por confirmar</CSBadge>
          <CSBadge status="reserved" dot>Reservado</CSBadge>
          <CSBadge tier="A" dot>Tier A</CSBadge>
          <CSBadge tier="B" dot>Tier B</CSBadge>
          <CSBadge tier="C" dot>Tier C</CSBadge>
        </div>
      </CSCard>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <CSCard padding={16}>
          <div style={{ fontSize: 12, fontWeight: 600, color: T.textMuted, marginBottom: 10 }}>Card de stand</div>
          <div style={{ display: 'flex', gap: 8 }}>
            {['available', 'pending', 'reserved'].map(st => {
              const status = STATUS[st];
              return (
                <div key={st} style={{ flex: 1, padding: 10, borderRadius: 6, background: status.soft, border: `2px solid ${status.color}`, textAlign: 'center' }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: status.color }}>S07</div>
                  <div style={{ fontSize: 9, color: status.color, fontFamily: T.fontMono }}>B</div>
                </div>
              );
            })}
          </div>
        </CSCard>
        <CSCard padding={16}>
          <div style={{ fontSize: 12, fontWeight: 600, color: T.textMuted, marginBottom: 10 }}>Tooltip</div>
          <div style={{ position: 'relative', height: 70, display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
            <CSStandTooltip stand={STANDS[0]} x={0} y={0} />
            <div style={{ width: 36, height: 32, background: TIERS.A.soft, border: `2px solid ${TIERS.A.color}`, borderRadius: 4 }} />
          </div>
        </CSCard>
      </div>
      <CSCard padding={16}>
        <div style={{ fontSize: 12, fontWeight: 600, color: T.textMuted, marginBottom: 10 }}>Input</div>
        <CSInput placeholder="Tu correo" icon={Icons.mail(14)} value="maria@ejemplo.com" />
      </CSCard>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
